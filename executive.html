<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลผู้บริหาร</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="executive-section">
    <div class="container">
      <h2 class="title">คณะผู้บริหาร</h2>
      <div class="divider"></div>

      <!-- ผู้บริหารระดับสูง (ผู้อำนวยการ/ผู้รับใบอนุญาต) -->
      <div class="top-executive">
        <div class="executive-card main-card">
          <div class="image-wrapper">
            <img src="images/director.jpg" alt="ผู้อำนวยการ">
          </div>
          <div class="executive-info">
            <h3>ดร.ชื่อ-นามสกุล</h3>
            <p class="position">ผู้อำนวยการ</p>
          </div>
        </div>
      </div>

      <!-- คณะผู้บริหาร / รองผู้อำนวยการ -->
      <div class="executive-grid">
        <div class="executive-card">
          <div class="image-wrapper">
            <img src="images/executive-1.jpg" alt="รองผู้อำนวยการ">
          </div>
          <div class="executive-info">
            <h3>อ.ชื่อ-นามสกุล</h3>
            <p class="position">รองผู้อำนวยการฝ่ายวิชาการ</p>
          </div>
        </div>

        <div class="executive-card">
          <div class="image-wrapper">
            <img src="images/executive-2.jpg" alt="รองผู้อำนวยการ">
          </div>
          <div class="executive-info">
            <h3>อ.ชื่อ-นามสกุล</h3>
            <p class="position">รองผู้อำนวยการฝ่ายกิจการนักศึกษา</p>
          </div>
        </div>

        <div class="executive-card">
          <div class="image-wrapper">
            <img src="images/executive-3.jpg" alt="รองผู้อำนวยการ">
          </div>
          <div class="executive-info">
            <h3>อ.ชื่อ-นามสกุล</h3>
            <p class="position">รองผู้อำนวยการฝ่ายบริหารงานทั่วไป</p>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
